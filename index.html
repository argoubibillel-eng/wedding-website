<!doctype html>
<html class="no-js" lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <title>حفل زفاف بلال وعقيلة</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Cairo:400,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body, h1, h2, h3 { font-family: 'Cairo', sans-serif !important; text-align: center; }
        .btn-maps { background-color: #F14E95; color: #fff !important; padding: 12px 30px; border-radius: 30px; }
    </style>
</head>
<body>
    <header id="fh5co-header" class="fh5co-cover" style="background-image:url(images/img_bg_3.jpg);" data-stellar-background-ratio="0.5">
        <div class="overlay"></div>
        <div class="container">
            <div class="display-t">
                <div class="display-tc">
                    <h1>بِلال &amp; عقيلة</h1>
                    <h2>نحن بصدد إقامة حفل زفافنا</h2>
                    <div class="simply-countdown simply-countdown-one"></div>
                </div>
            </div>
        </div>
    </header>

    <div id="fh5co-couple">
        <div class="container">
            <div class="fh5co-heading">
                <h2>بارك الله لهما وبارك عليهما وجمع بينهما في خير</h2>
                <h3>يتشرف عائلتا العرقوبي بدعوتكم لحضور حفل زفاف نجليهما</h3>
            </div>
            <div class="couple-wrap" style="display: flex; justify-content: center; gap: 20px;">
                <div class="couple-half">
                    <img src="images/groom.jpg" alt="العريس" class="img-responsive">
                    <h3>بِلال</h3>
                </div>
                <div class="couple-half">
                    <img src="images/bride.jpg" alt="العروس" class="img-responsive">
                    <h3>عقيلة</h3>
                </div>
            </div>
        </div>
    </div>

    <div id="fh5co-event">
        <div class="container">
            <div class="event-wrap" style="background: rgba(255,255,255,0.9); padding: 30px;">
        
                <p>السبت 04 سبتمبر 2027 | 08:00 مساءً</p>

            </div>
        </div>
    </div>

    <script src="js/jquery.min.js"></script>
    <script src="js/simplyCountdown.js"></script>
    <script>
        var d = new Date('2027-09-04T20:00:00');
        simplyCountdown('.simply-countdown-one', { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() });
    </script>
</body>
</html>
