<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل زفاف بلال وعقيلة</title>
    <style>
        body { 
            font-family: 'Amiri', serif; 
            background: url('1000023041_2.png') no-repeat center center fixed; 
            background-size: cover; 
            text-align: center; 
            padding: 20px; 
            margin: 0;
        }
        .card { 
            background: rgba(255, 255, 255, 0.85); 
            border-radius: 20px; 
            padding: 30px; 
            max-width: 450px; 
            margin: 50px auto; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        h2 { color: #8b7355; font-weight: bold; }
        .event { margin: 15px 0; padding: 10px; border-bottom: 1px solid #ddd; }
        .btn-map { color: #8b7355; font-weight: bold; text-decoration: none; }
        audio { width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- الآية -->
        <p><em>"وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا"</em></p>

        <!-- العنوان والتواريخ -->
        <h2>حفل زفاف بلال وعقيلة</h2>
        <p>4 سبتمبر 2027</p>
        <p>يتشرف العرقوبي والجبالي بدعوتكم لحضور حفل زفاف نجليهما.</p>

        <!-- المواقع -->
        <div class="event">عشاء العروس (2 سبتمبر): <a href="ضع_رابط_موقع_العروس_هنا" class="btn-map">الموقع</a></div>
        <div class="event">عشاء العريس (3 سبتمبر): <a href="ضع_رابط_موقع_العريس_هنا" class="btn-map">الموقع</a></div>
        <div class="event">الاستقبال (4 سبتمبر): <a href="ضع_رابط_القاعة_هنا" class="btn-map">الموقع</a></div>

        <!-- الأغنية -->
        <p>🎧 استمع إلى أغنيتنا</p>
        <audio id="myAudio" controls autoplay>
            <source src="wedding-song.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        window.onload = function() {
            var audio = document.getElementById("myAudio");
            audio.play().catch(() => console.log("تحتاج للضغط على الصفحة للتشغيل"));
        };
    </script>

</body>
</html>
