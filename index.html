<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل زفاف بلال وعقيلة</title>
    <!-- استيراد الخطوط والأنماط -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body { 
            font-family: 'Amiri', serif; 
            background: #fdfbfb; 
            color: #4a4a4a; 
            text-align: center; 
            padding: 20px; 
        }
        .card { 
            border: none; 
            background: rgba(255, 255, 255, 0.9); 
            border-radius: 20px; 
            margin: 20px auto; 
            max-width: 450px; 
            padding: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { color: #8b7355; font-weight: bold; margin-bottom: 10px; }
        .audio-section { margin-top: 20px; }
        audio { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <!-- هنا يظهر التصميم الخاص بك -->
        <h2>حفل زفاف بلال وعقيلة</h2>
        <p>4 سبتمبر 2027</p>
        <p>يتشرف العرقوبي والجبالي بدعوتكم لحضور حفل زفاف نجليهما.<br>بارك الله لهما وجمع بينهما في خير.<br>بانتظار حضوركم.</p>

        <!-- مشغل الأغنية النظيف -->
        <div class="audio-section">
            <p>🎧 استمع إلى أغنيتنا الخاصة</p>
            <audio controls autoplay id="myAudio">
                <source src="Musique/wedding.mp3" type="audio/mpeg">
                متصفحك لا يدعم تشغيل الصوت.
            </audio>
        </div>
    </div>

    <script>
        // محاولة التشغيل التلقائي عند تحميل الصفحة
        window.onload = function() {
            var audio = document.getElementById("myAudio");
            audio.play().catch(function() {
                console.log("التشغيل التلقائي يتطلب تفاعلاً من المستخدم.");
            });
        };
    </script>

</body>
</html>
