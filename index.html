<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حفل زفاف بلال وعقيلة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('1000023041.png') no-repeat center top;
            background-size: contain; /* ليظهر التصميم كاملاً */
            background-color: #fdf5e6; /* لون مقارب لخلفية الصورة */
            font-family: 'Amiri', serif;
            text-align: center;
        }
        /* نضع المحتوى في الأسفل بعيداً عن الرسم */
        .content { margin-top: 85vh; padding-bottom: 50px; }
        
        .event-box { background: rgba(255, 255, 255, 0.8); border-radius: 15px; padding: 15px; margin: 10px auto; max-width: 350px; }
        .btn-map { color: #8b7355; font-weight: bold; display: block; margin-top: 5px; }
        audio { width: 300px; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="content">
        <p><em>"وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا"</em></p>

        <div class="event-box">
            عشاء العروس (2 سبتمبر): <a href="ضع_الرابط" class="btn-map">موقع منزل العروس</a>
        </div>
        <div class="event-box">
            عشاء العريس (3 سبتمبر): <a href="ضع_الرابط" class="btn-map">موقع منزل العريس</a>
        </div>
        <div class="event-box">
            الاستقبال (4 سبتمبر): <a href="ضع_الرابط" class="btn-map">موقع القاعة</a>
        </div>

        <audio id="myAudio" controls autoplay>
            <source src="wedding-song.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        window.onload = function() {
            document.getElementById("myAudio").play().catch(() => {});
        };
    </script>
</body>
</html>
